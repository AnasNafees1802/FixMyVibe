# FixMyVibe rule pack. One file, read by both engines (fixmyvibe-audit.sh and fixmyvibe-audit.ps1).
#
# Block format:
#   [RULE-ID]            the same id may appear on several blocks
#   sev = blocker|warning
#   case = s|i           case sensitive or insensitive (default s)
#   scope = any | group names or file extensions, space separated (default any)
#   match = regex        a line is a finding when it matches
#   unless = regex       optional; the finding is dropped when the same line also matches this
#   msg = text
#
# Regex dialect: POSIX ERE restricted to what GNU grep, BSD grep and .NET agree on.
#   Allowed escapes: \. \( \) \[ \] \{ \} \* \+ \? \| \$ \^ \\   Nothing else (no \s \d \w \b).
#   Use [[:space:]] [[:alnum:]] [[:digit:]] [[:alpha:]] for classes. No backslash inside brackets.
#   In a negated class put a literal - last, never first.
#   A pattern that silently matches nothing looks like a clean scan, so tests/run.* lints this file
#   and requires a hit line and a miss line in tests/corpus.txt for every rule id.
#
# Engine-coded findings (not regex): SEC006 env file not gitignored, GATE001 gate config changed.

[groups]
code = js jsx ts tsx mjs cjs mts cts py rb go rs java kt kts swift cs php sh bash zsh ps1 psm1 vue svelte astro scala dart ex exs lua
jsfam = js jsx ts tsx mjs cjs mts cts vue svelte astro
markup = html htm vue svelte astro jsx tsx erb ejs hbs njk twig liquid mdx php
style = css scss sass less styl html htm vue svelte astro jsx tsx
prose = md mdx markdown txt rst adoc html htm vue svelte astro jsx tsx erb ejs hbs njk twig liquid
config = yml yaml env ini conf toml properties dockerfile tf tfvars
ci = yml yaml

# ---------------------------------------------------------------- secrets

[SEC001]
sev = blocker
scope = any
match = (^|[^A-Za-z0-9_])(sk-[A-Za-z0-9]{32,}|sk-(proj|ant|svcacct|or-v1)-[A-Za-z0-9_-]{20,}|[sr]k_live_[A-Za-z0-9]{16,}|A[KS]IA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,}|glpat-[A-Za-z0-9_-]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|npm_[A-Za-z0-9]{36}|SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}|hooks\.slack\.com/services/T[A-Za-z0-9]+/B[A-Za-z0-9]+/[A-Za-z0-9]+)
unless = [Xx]{8,}|EXAMPLE|example|placeholder|redacted
msg = provider credential in source: move it to the environment and rotate it

[SEC002]
sev = blocker
scope = any
match = -----BEGIN ([A-Z]+ )?PRIVATE KEY-----
msg = private key committed as text: remove it and rotate the key

[SEC003]
sev = blocker
case = i
scope = any
match = (password|passwd|pwd|secret|api[_-]?key|access[_-]?key|auth[_-]?token|access[_-]?token|client[_-]?secret|private[_-]?key|token)["']?[[:space:]]*[:=][[:space:]]*["'][^"'[:space:]]{8,}["']
unless = [:=][[:space:]]*["'][A-Za-z_.-]+["']|[:=][[:space:]]*["'][^"']*(example|sample|dummy|placeholder|changeme|change[_-]me|replace|redacted|your[_-]|xxxx|\*\*\*|fake|mock|test|\$\{|\{\{|%s|<)
msg = hardcoded credential literal: read it from the environment; a fixture should use an obviously fake value

[SEC004]
sev = blocker
case = i
scope = any
match = [a-z][a-z0-9+.-]*://[^/@:[:space:]"'<>]+:[^/@[:space:]"'<>]{3,}@[a-z0-9.-]+
unless = ://[^@]*(\$|\{|%|<|\*\*|xxx)|:(pass|password|passwd|secret|pwd|changeme|example)@|@(localhost|127\.0\.0\.1|example\.)
msg = credentials embedded in a URL: build the URL from environment values

[SEC005]
sev = warning
case = i
scope = config
match = ^[[:space:]]*-?[[:space:]]*(export[[:space:]]+)?[A-Za-z0-9_.-]*(password|passwd|secret|api_?key|token)[[:space:]]*[:=][[:space:]]*[^[:space:]"'$<{#][^[:space:]]{7,}[[:space:]]*$
unless = example|sample|dummy|placeholder|changeme|replace|redacted|your[_-]|xxxx|fake|test|[:=][[:space:]]*[A-Za-z_.-]+[[:space:]]*$|[:=][[:space:]]*(/|\./|file:|arn:|vault:|ref\+)
msg = credential value in a config file: confirm it is not a real secret, or reference a secret store

[SEC007]
sev = blocker
case = i
scope = code
match = process\.env(\.[A-Za-z0-9_]*|\[["'][A-Za-z0-9_]*)(secret|key|token|password|passwd)[A-Za-z0-9_]*(["']\])?[[:space:]]*(\|\||\?\?)[[:space:]]*["'][^"']{4,}["']
msg = secret with a hardcoded fallback: fail at startup when the variable is missing instead

[SEC007]
sev = blocker
case = i
scope = py
match = (getenv|environ\.get)\([[:space:]]*["'][A-Za-z0-9_]*(secret|key|token|password|passwd)[A-Za-z0-9_]*["'][[:space:]]*,[[:space:]]*["'][^"']{4,}["']
msg = secret with a hardcoded fallback: fail at startup when the variable is missing instead

[SEC008]
sev = blocker
scope = any
match = (^|[^A-Z0-9_])(NEXT_PUBLIC|VITE|REACT_APP|EXPO_PUBLIC|NUXT_PUBLIC|GATSBY|PUBLIC)_[A-Z0-9_]*(SECRET|PRIVATE_KEY|SERVICE_ROLE|PASSWORD|OPENAI|ANTHROPIC|GROQ|MISTRAL|DATABASE_URL|RESEND|SENDGRID|TWILIO_AUTH|AWS_SECRET)
