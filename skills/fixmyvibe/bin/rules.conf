# ---------------------------------------------------------------- correctness and honesty

[COR001]
sev = blocker
scope = code
match = catch[[:space:]]*(\([^)]*\))?[[:space:]]*\{[[:space:]]*\}|except[[:space:]]*(BaseException|Exception)?[[:space:]]*(as[[:space:]]+[A-Za-z_]+)?[[:space:]]*:[[:space:]]*(pass|\.\.\.)[[:space:]]*($|#)|\.catch\([[:space:]]*\(?[[:space:]]*[A-Za-z_]*[[:space:]]*\)?[[:space:]]*=>[[:space:]]*\{[[:space:]]*\}[[:space:]]*\)|if[[:space:]]+err[[:space:]]*!=[[:space:]]*nil[[:space:]]*\{[[:space:]]*\}
