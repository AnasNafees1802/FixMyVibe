[SEC009]
sev = blocker
scope = jsfam
match = dangerouslyAllowBrowser[[:space:]]*:[[:space:]]*true
msg = model API key used from the browser: call the provider from your server

[SEC010]
sev = warning
scope = any
match = (^|[^A-Za-z0-9_-])eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}
msg = JWT literal in source: fine for a public anon key, a blocker for a service-role or session token

