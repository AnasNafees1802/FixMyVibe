match = uses:[[:space:]]*[^[:space:]@]+@(main|master|latest|dev)[[:space:]]*$
msg = action pinned to a moving branch: pin a release tag or commit

[DEP001]
sev = warning
case = i
scope = dockerfile
match = ^FROM[[:space:]]+[^[:space:]]+:latest
msg = image pinned to latest: pin a version or digest

[DEP001]
sev = warning
scope = json
match = "[^"]+"[[:space:]]*:[[:space:]]*"(latest|\*)"
