match = (values[[:space:]]*\([^)]*|(where|and|or|set)[[:space:]]+[a-z0-9_."]+[[:space:]]*(=|<|>|like[[:space:]]|in[[:space:]]*\()[[:space:]]*'?%?)\$\{
unless = `
