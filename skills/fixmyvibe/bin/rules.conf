[SEC104]
sev = blocker
scope = code
match = (^|[^A-Za-z0-9_.$:])eval[[:space:]]*\([[:space:]]*[^)[:space:]]|new[[:space:]]+Function[[:space:]]*\(|(^|[^A-Za-z0-9_])os\.system[[:space:]]*\(|(^|[^A-Za-z0-9_.])exec(Sync)?[[:space:]]*\([[:space:]]*(`[^`]*\$\{|["'][^"']*["'][[:space:]]*\+)
