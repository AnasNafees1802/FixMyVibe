match = subprocess\.[a-z_]+\([[:space:]]*[^"'[:space:]][^)]*shell[[:space:]]*=[[:space:]]*True
msg = shell=True with a non-literal command: pass an argument list without a shell

[SEC105]
sev = blocker
scope = code config
match = verify[[:space:]]*=[[:space:]]*False[[:space:]]*[,)]|rejectUnauthorized["']?[[:space:]]*:[[:space:]]*false|NODE_TLS_REJECT_UNAUTHORIZED[^A-Za-z0-9]{1,8}0|InsecureSkipVerify[[:space:]]*:[[:space:]]*true|_create_unverified_context|CURLOPT_SSL_VERIFYPEER[^;]*(false|0)
