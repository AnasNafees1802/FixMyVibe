[SEC106]
sev = blocker
case = i
scope = code
match = (md5|sha1)[[:space:]]*\([^)]*(password|passwd|pwd)|createHash\([[:space:]]*["'](md5|sha1)["'][[:space:]]*\)[^;]*(password|passwd|pwd)|(password|passwd|pwd)[^;]*[^a-z0-9_](md5|sha1)[[:space:]]*\(
msg = weak password hashing: use argon2, scrypt or bcrypt

[SEC107]
sev = blocker
scope = code
match = verify_signature["']?[[:space:]]*:[[:space:]]*False|algorithms?["']?[[:space:]]*[:=][[:space:]]*\[?[[:space:]]*["'](none|None|NONE)["']|jwt\.decode\([^)]*verify[[:space:]]*=[[:space:]]*False
msg = JWT signature verification disabled: always verify with a pinned algorithm

[SEC201]
sev = warning
scope = code markup
match = dangerouslySetInnerHTML|\.(inner|outer)HTML[[:space:]]*\+?=[^=]|insertAdjacentHTML[[:space:]]*\(|document\.write(ln)?[[:space:]]*\(|v-html=|\{@html[[:space:]]|bypassSecurityTrust|\|[[:space:]]*safe[[:space:]]*\}\}|mark_safe\(|\.html_safe
unless = \.(inner|outer)HTML[[:space:]]*=[[:space:]]*(""|''|``)
msg = raw HTML sink: prove the value is trusted or sanitized, then annotate the reason

[SEC202]
sev = warning
scope = code
match = pickle\.loads?[[:space:]]*\(|yaml\.load[[:space:]]*\(|yaml\.unsafe_load|marshal\.loads|BinaryFormatter|ObjectInputStream|(^|[^A-Za-z0-9_])unserialize[[:space:]]*\(|torch\.load[[:space:]]*\(
unless = SafeLoader|safe_load|weights_only[[:space:]]*=[[:space:]]*True
msg = unsafe deserialization sink: never feed it untrusted bytes

[SEC203]
sev = warning
case = i
scope = code config
match = Access-Control-Allow-Origin["'[:space:]:,]+\*|origin["']?[[:space:]]*:[[:space:]]*["']\*["']|allow_origins[[:space:]]*=[[:space:]]*\[[[:space:]]*["']\*["']|(^|[^A-Za-z0-9_.])cors\(\)|CORS\(app\)|AllowAnyOrigin\(\)
msg = CORS open to every origin: list the origins unless this is a public API without credentials

[SEC204]
sev = warning
scope = py config
match = (^|[^A-Za-z0-9_])(debug|DEBUG)[[:space:]]*=[[:space:]]*True
